# Checks every supporting link once a week, so broken links are found even when
# nothing in the repository changes. Opens an issue if any link fails.
name: Weekly link check

on:
  schedule:
    - cron: "0 19 * * 0" # Monday 8am NZDT
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml content/
          fail: false
      - name: Open an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken supporting links found
          content-filepath: ./lychee/out.md
          labels: content, links
