# Materiality: how much the application matters, rated 1 (Immaterial) to 5 (Critical).
# Scored separately from the UX health score and never combined with it.
# Rating = weighted average of answered factors, rounded; if any floor_trigger factor
# is answered 5, the rating can't be lower than floor_minimum.

floor_minimum: 4
levels:
- rating: 1
  label: Immaterial
  meaning: Little dependence on the application. Light-touch support and periodic health checks are proportionate.
  colour: green
- rating: 2
  label: Low
  meaning: Some users rely on it occasionally, with easy alternatives. Standard support; fix issues in the normal release cycle.
  colour: yellow-green
- rating: 3
  label: Moderate
  meaning: A meaningful service for its users or the organisation. Planned support and monitoring; fix significant issues promptly.
  colour: yellow
- rating: 4
  label: High
  meaning: Users or the organisation depend on it. Business-hours (or better) support, proactive monitoring, and prompt remediation of health check findings.
  colour: orange
- rating: 5
  label: Critical
  meaning: Users must use it to complete necessary tasks and failure has serious consequences. Highest support tier, 24/7 monitoring, and priority remediation of all critical and high findings.
  colour: red
factors:
- id: MAT-01
  factor: User dependence
  question: How dependent are users on the information or service provided in this application?
  anchors:
  - Information or service is readily available elsewhere; using this app is optional.
  - Available elsewhere with little extra effort.
  - Alternatives exist but are noticeably slower, harder or less complete.
  - Few practical alternatives; users rely on this app for important tasks.
  - Only available in this app, and users need it to complete a necessary or legally required task.
  weight: 3
  floor_trigger: true
- id: MAT-02
  factor: Organisation dependence
  question: How dependent is the organisation on this application, and how would an outage of several hours be received?
  anchors:
  - An outage of several days would be tolerated with little impact.
  - An outage of a day would cause internal inconvenience only.
  - An outage of several hours would disrupt business processes.
  - An outage of several hours could lead to complaints from a small group of high-touch users or stakeholders.
  - An outage of several hours could attract media attention, Ministerial interest or a breach of statutory obligations.
  weight: 3
  floor_trigger: true
- id: MAT-03
  factor: Relative importance
  question: How important is this application to its users compared with the organisation's other applications?
  anchors:
  - One of many minor applications; rarely front of mind.
  - Below average importance.
  - Similar importance to most of the organisation's applications.
  - One of the organisation's more important applications.
  - A flagship or primary channel for the organisation's users.
  weight: 2
  floor_trigger: false
- id: MAT-04
  factor: Scope of user base
  question: How broad is the user base - one user group, or several?
  anchors:
  - A single small internal team.
  - One user group (internal or external).
  - Two or three distinct user groups.
  - Several user groups, including external users.
  - Many user groups, including the general public or sector-wide users.
  weight: 2
  floor_trigger: false
- id: MAT-05
  factor: Scale of user base
  question: Roughly how many people use the application?
  anchors:
  - Fewer than 10.
  - 10 to 99.
  - 100 to 999.
  - 1,000 to 9,999.
  - 10,000 or more.
  weight: 2
  floor_trigger: false
- id: MAT-06
  factor: Frequency of access
  question: How often are typical users expected to use the application?
  anchors:
  - Annually or less often.
  - Quarterly.
  - Monthly.
  - Weekly.
  - Daily or more often.
  weight: 1
  floor_trigger: false
- id: MAT-07
  factor: Consequence of failure or error
  question: What is the consequence for users if the application fails, is unavailable or gives wrong information?
  anchors:
  - Minor inconvenience only.
  - Delay or extra effort, easily recovered.
  - Significant delay, cost or rework for users.
  - Financial, legal or reputational harm to users, or a missed obligation.
  - Serious harm - safety, rights, entitlements or statutory deadlines - that may be hard to reverse.
  weight: 3
  floor_trigger: true
- id: MAT-08
  factor: Time sensitivity
  question: How time-critical are the tasks users complete in the application?
  anchors:
  - Can wait weeks without impact.
  - Can wait days.
  - Should be completed within a day or two.
  - Same-day completion often needed.
  - Time-critical or tied to statutory deadlines; delays have consequences.
  weight: 1
  floor_trigger: false
- id: MAT-09
  factor: Users at risk of exclusion
  question: To what extent does the application serve people who may be disadvantaged if it doesn't work well for them (for example disabled people, people with limited digital access, or people in difficult circumstances)?
  anchors:
  - Not at all - users are a small, digitally capable professional group.
  - A few such users.
  - A meaningful minority of users.
  - A large share of users.
  - Primarily serves people at risk of exclusion or in difficult circumstances.
  weight: 2
  floor_trigger: false
- id: MAT-10
  factor: Sensitivity of information
  question: How sensitive is the information the application collects, stores or displays?
  anchors:
  - Public information only.
  - Low-sensitivity internal or contact information.
  - Personal information.
  - Sensitive personal or commercially sensitive information.
  - Highly sensitive information (for example health, financial, identity or classified information).
  weight: 1
  floor_trigger: false
