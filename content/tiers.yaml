# Proposed service tier definitions (not yet agreed by the organisation).
# rating_to_tier maps the materiality rating (1-5) to a suggested tier.
# target_rating is the minimum UX health rating expected for the tier.

status: proposed
rating_to_tier:
  1: bronze
  2: bronze
  3: silver
  4: gold
  5: platinum
field_labels:
  name: Tier
  materiality: Materiality rating
  when_to_use: When to use
  availability: Availability target
  support_hours: Support hours
  p1_incident: 'Priority 1 incident: response / restore'
  p2_incident: 'Priority 2 incident: response / restore'
  rto: Recovery time objective (RTO)
  rpo: Recovery point objective (RPO)
  monitoring: Monitoring and alerting
  maintenance: Planned maintenance
  health_check_frequency: UX health check frequency
  target_rating_text: Target UX health rating
  remediation: Remediation of health check findings
  reporting: Performance reporting
tiers:
- id: platinum
  materiality: 5 Critical
  when_to_use: Users must use the application to complete necessary tasks; failure has serious consequences or could attract media or Ministerial attention.
  availability: 99.9% monthly, measured on key user journeys (about 45 minutes unplanned downtime a month)
  support_hours: 24/7, including on-call
  p1_incident: 15 minutes / 2 hours (workaround or restore), 24/7
  p2_incident: 1 hour / 8 hours
  rto: 4 hours
  rpo: 15 minutes
  monitoring: 24/7 synthetic monitoring of key journeys at least every 5 minutes, with paging and a public status page
  maintenance: Outside business hours, with at least 5 business days' notice to users
  health_check_frequency: Every 6 months and after any major change
  target_rating_text: Strong (85+), with all critical criteria in place
  remediation: Critical findings within 1 month; high within 3 months
  reporting: Monthly to the service owner; quarterly to governance
  name: Platinum
  target_rating: healthy
- id: gold
  materiality: 4 High
  when_to_use: Users or the organisation depend on the application; an outage of several hours could bring complaints from high-touch users or stakeholders.
  availability: 99.5% monthly (about 3.5 hours unplanned downtime a month)
  support_hours: Extended hours (7am-7pm business days), with on-call for Priority 1
  p1_incident: 30 minutes / 4 hours
  p2_incident: 2 business hours / 1 business day
  rto: 8 hours
  rpo: 1 hour
  monitoring: Synthetic monitoring of key journeys with alerts routed to the on-call team
  maintenance: Outside business hours where possible, with at least 5 business days' notice
  health_check_frequency: Annually and after any major change
  target_rating_text: Good (70+), with all critical criteria in place
  remediation: Critical findings within 3 months; high within 6 months
  reporting: Monthly to the service owner; quarterly to governance
  name: Gold
  target_rating: good
- id: silver
  materiality: 3 Moderate
  when_to_use: A meaningful service for its users or the organisation, with workarounds available during an outage.
  availability: 99.0% during business hours
  support_hours: Business hours (8am-5pm business days)
  p1_incident: 2 business hours / 1 business day
  p2_incident: 1 business day / 5 business days
  rto: 24 hours
  rpo: 24 hours
  monitoring: Uptime monitoring with alerts during business hours
  maintenance: With at least 2 business days' notice
  health_check_frequency: Annually
  target_rating_text: Developing (50+), with all critical criteria in place
  remediation: Critical findings within 6 months; high planned into the next release cycle
  reporting: Quarterly to the service owner
  name: Silver
  target_rating: needs-attention
- id: bronze
  materiality: 1-2 Immaterial or Low
  when_to_use: Optional or low-use application with easy alternatives; little impact if unavailable for several days.
  availability: Best effort during business hours
  support_hours: Business hours, best effort
  p1_incident: Next business day / 5 business days
  p2_incident: 5 business days / next planned release
  rto: 5 business days
  rpo: 24 hours
  monitoring: Basic uptime monitoring
  maintenance: Any time, with notice where practical
  health_check_frequency: Every 2 years, or after major change
  target_rating_text: All critical criteria in place
  remediation: Critical findings within 12 months, or risk formally accepted by the service owner
  reporting: Annually to the service owner
  name: Bronze
  target_rating: at-risk
