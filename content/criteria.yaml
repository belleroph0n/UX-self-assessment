# Master list of criteria. Every criterion is one question in the detailed assessment.
# Criteria with weight 3 also form the simple assessment (the app's default).
# Field guide: see docs/editing-content.md

criteria:
- id: ACC-01
  category: ACC
  subcategory: Conformance
  question: Has the service been assessed against WCAG 2.2 Level AA in the last 12 months, including manual testing (not automated tools alone)?
  evidence: Dated accessibility audit report covering the service's key pages and complete processes, with manual test results.
  weight: 3
  critical: true
  recommendation: Commission or complete a WCAG 2.2 AA assessment that includes manual and assistive technology testing, covering every page in each complete process, and repeat it at least annually or after major change.
  source: NZ Government Web Accessibility Standard; WCAG 2.2
  source_version: WAS 1.2 (from 17 Mar 2025); WCAG 2.2 AA
  nz_status: mandatory
  applies_to: all
  link:
    label: NZ Web Accessibility Standard 1.2
    url: https://www.digital.govt.nz/standards-and-guidance/nz-government-web-standards/web-accessibility-standard-1-2
  review_note: Draft Digital Accessibility Standard (DAS), based on EN 301 549, expected to replace WAS in early 2027. Review wording when DAS is final.
- id: ACC-02
  category: ACC
  subcategory: Assistive technology
  question: Have the service's key tasks been tested end to end with screen readers on both desktop and mobile (for example NVDA or JAWS, VoiceOver, TalkBack)?
  evidence: Test scripts and results per screen reader/browser combination, dated, with issues logged.
  weight: 3
  critical: false
  recommendation: Test every key task with at least one desktop and one mobile screen reader, ideally including blind and low vision users, and fix issues that stop tasks being completed.
  source: WCAG 2.2 SC 4.1.2, 1.3.1; W3C WCAG-EM
  source_version: WCAG 2.2; WCAG-EM 2.0 (Jul 2026)
  nz_status: recommended
  applies_to: all
  link:
    label: W3C accessibility evaluation methodology
    url: https://www.w3.org/WAI/test-evaluate/conformance/wcag-em/
- id: ACC-03
  category: ACC
  subcategory: Perceivable
  question: Do all images, icons, charts and other non-text content have appropriate text alternatives (or are marked as decorative)?
  evidence: Audit findings for SC 1.1.1; content guidance requiring alt text; CMS alt text field usage.
  weight: 2
  critical: false
  recommendation: Provide meaningful text alternatives for informative images, icons and charts, mark decorative images so screen readers skip them, and provide data tables for complex charts.
  source: WCAG 2.2 SC 1.1.1
  source_version: WCAG 2.2 A
  nz_status: mandatory
  applies_to: all
  link:
    label: WCAG 2.2 quick reference
    url: https://www.w3.org/WAI/WCAG22/quickref/
- id: ACC-04
  category: ACC
  subcategory: Perceivable
  question: Is page structure conveyed programmatically - meaningful page titles, headings, landmarks, lists, table headers and form labels?
  evidence: Audit findings for SC 1.3.1, 2.4.2, 2.4.6; screen reader heading/landmark navigation test.
  weight: 2
  critical: false
  recommendation: Use semantic HTML (headings, landmarks, lists, labelled controls) and unique, descriptive page titles so screen reader users can understand and navigate the structure.
  source: WCAG 2.2 SC 1.3.1, 2.4.2, 2.4.6
  source_version: WCAG 2.2 A/AA
  nz_status: mandatory
  applies_to: all
  link:
    label: WCAG 2.2 quick reference
    url: https://www.w3.org/WAI/WCAG22/quickref/
- id: ACC-05
  category: ACC
  subcategory: Operable
  question: Can every function be used with a keyboard alone, with no keyboard traps, a logical focus order, and a visible focus indicator that is not hidden by other content?
  evidence: Keyboard-only test of each key task; audit findings for SC 2.1.1, 2.1.2, 2.4.3, 2.4.7, 2.4.11.
  weight: 3
  critical: true
  recommendation: Make all functionality keyboard operable, remove keyboard traps, keep focus order logical and ensure the focus indicator is always visible and not obscured by sticky headers, banners or overlays.
  source: WCAG 2.2 SC 2.1.1, 2.1.2, 2.4.3, 2.4.7, 2.4.11
  source_version: WCAG 2.2 A/AA
  nz_status: mandatory
  applies_to: all
  link:
    label: WCAG 2.2 quick reference
    url: https://www.w3.org/WAI/WCAG22/quickref/
- id: ACC-06
  category: ACC
  subcategory: Low vision
  question: Do text, icons, form borders and focus indicators meet WCAG contrast ratios (4.5:1 for normal text, 3:1 for large text and non-text elements)?
  evidence: Contrast check results for brand palette and UI components; audit findings for SC 1.4.3 and 1.4.11.
  weight: 2
  critical: false
  recommendation: Check all text and interface components against WCAG contrast ratios and adjust colour tokens in the design system so every combination in use passes.
  source: WCAG 2.2 SC 1.4.3, 1.4.11
  source_version: WCAG 2.2 AA
  nz_status: mandatory
  applies_to: all
  link:
    label: WCAG 2.2 quick reference
    url: https://www.w3.org/WAI/WCAG22/quickref/
- id: ACC-07
  category: ACC
  subcategory: Low vision
  question: Does content remain usable when text is resized to 200% and when zoomed to 400% (320 CSS pixels wide) without loss of content or horizontal scrolling?
  evidence: Zoom and reflow test results on key pages; audit findings for SC 1.4.4, 1.4.10, 1.4.12.
  weight: 2
  critical: false
  recommendation: Use responsive layouts and relative units so content reflows at 400% zoom and text spacing can be increased without content being cut off or overlapping.
  source: WCAG 2.2 SC 1.4.4, 1.4.10, 1.4.12
  source_version: WCAG 2.2 AA
  nz_status: mandatory
  applies_to: all
  link:
    label: WCAG 2.2 quick reference
    url: https://www.w3.org/WAI/WCAG22/quickref/
- id: ACC-08
  category: ACC
  subcategory: Perceivable
  question: Is information never conveyed by colour alone (for example error states, required fields, chart series, status indicators)?
  evidence: Audit findings for SC 1.4.1; review of status and error patterns.
  weight: 1
  critical: false
  recommendation: Pair colour with text, icons or patterns so information is still available to people who cannot perceive colour differences.
  source: WCAG 2.2 SC 1.4.1
  source_version: WCAG 2.2 A
  nz_status: mandatory
  applies_to: all
  link:
    label: WCAG 2.2 quick reference
    url: https://www.w3.org/WAI/WCAG22/quickref/
- id: ACC-09
  category: ACC
  subcategory: Forms
  question: Do forms have visible labels and instructions, identify errors in text, suggest corrections, and announce status messages to assistive technology?
  evidence: Audit findings for SC 3.3.1, 3.3.2, 3.3.3, 4.1.3; screen reader test of form errors.
  weight: 2
  critical: false
  recommendation: Give every field a visible label and clear instructions, describe errors in text next to the field and in a summary, suggest how to fix them, and announce status changes to screen readers.
  source: WCAG 2.2 SC 3.3.1, 3.3.2, 3.3.3, 4.1.3
  source_version: WCAG 2.2 A/AA
  nz_status: mandatory
  applies_to: transactional
  link:
    label: WCAG 2.2 quick reference
    url: https://www.w3.org/WAI/WCAG22/quickref/
- id: ACC-10
  category: ACC
  subcategory: Forms
  question: Does sign-in avoid cognitive function tests (such as remembering or transcribing codes without paste or password manager support), and does the service avoid asking for the same information twice?
  evidence: Audit findings for SC 3.3.7 and 3.3.8 (new in WCAG 2.2); sign-in flow review.
  weight: 2
  critical: false
  recommendation: Allow paste and password managers, offer alternatives to puzzles or memory tests at sign-in, and auto-fill or let users select information they have already given.
  source: WCAG 2.2 SC 3.3.7, 3.3.8
  source_version: WCAG 2.2 A/AA
  nz_status: mandatory
  applies_to: authenticated
  link:
    label: WCAG 2.2 quick reference
    url: https://www.w3.org/WAI/WCAG22/quickref/
- id: ACC-11
  category: ACC
  subcategory: Mobile
  question: Are touch targets large enough (at least 24 by 24 CSS pixels or adequately spaced), and can actions that use dragging or multi-point gestures also be done with a single tap?
  evidence: Audit findings for SC 2.5.7, 2.5.8; mobile device testing.
  weight: 1
  critical: false
  recommendation: Size and space interactive targets to at least 24 by 24 CSS pixels and provide single-pointer alternatives for drag and gesture interactions.
  source: WCAG 2.2 SC 2.5.7, 2.5.8
  source_version: WCAG 2.2 AA
  nz_status: mandatory
  applies_to: all
  link:
    label: WCAG 2.2 quick reference
    url: https://www.w3.org/WAI/WCAG22/quickref/
- id: ACC-12
  category: ACC
  subcategory: Media
  question: Do videos and audio have captions, transcripts and (where needed) audio description?
  evidence: Media inventory showing captions, transcripts and audio description status.
  weight: 1
  critical: false
  recommendation: Provide captions and transcripts for all prerecorded media and audio description where visual information is not otherwise conveyed, noting the specific exceptions in the Web Accessibility Standard.
  source: WCAG 2.2 SC 1.2.1, 1.2.2, 1.2.5; WAS 1.2 exceptions
  source_version: WCAG 2.2 A/AA; WAS 1.2
  nz_status: mandatory
  applies_to: uses-media
  link:
    label: WCAG 2.2 quick reference
    url: https://www.w3.org/WAI/WCAG22/quickref/
  review_note: WAS 1.2 modifies some media requirements (e.g. live captions, audio description). Check current exceptions.
- id: ACC-13
  category: ACC
  subcategory: Documents
  question: Are PDFs, Word and other documents published by the service accessible, or accompanied by an accessible HTML alternative?
  evidence: Document inventory with accessibility status; publishing guidance.
  weight: 2
  critical: false
  recommendation: Publish key content as HTML first; where documents are needed, make them accessible (tagged, structured, with alt text) or provide an accessible alternative.
  source: NZ Government Web Accessibility Guide (accessibility-supported technologies); draft DAS
  source_version: WAS 1.2; DAS draft (Jul 2026)
  nz_status: mandatory
  applies_to: all
  link:
    label: NZ Digital Accessibility Standard (draft)
    url: https://www.digital.govt.nz/standards-and-guidance/nz-government-web-standards/digital-accessibility-standard
  review_note: Draft DAS extends scope beyond websites to documents, emails and mobile apps.
- id: ACC-14
  category: ACC
  subcategory: Process
  question: Is automated accessibility testing built into the design, build and release process (for example axe-core, Pa11y or CWAC) so detectable errors are caught before release?
  evidence: CI/CD configuration or test reports; CWAC scan results for the service.
  weight: 2
  critical: false
  recommendation: Add automated accessibility checks to the build pipeline and content publishing workflow, and treat new automatically detectable errors as release blockers.
  source: GCDO guidance on CWAC and automated testing
  source_version: CWAC (open source)
  nz_status: recommended
  applies_to: all
  link:
    label: CWAC accessibility checker (GitHub)
    url: https://github.com/GOVTNZ/cwac
  review_note: Automated tests detect only a subset of WCAG issues; never use as the sole evidence for ACC-01. CWAC is open source (GPL-3.0).
- id: ACC-15
  category: ACC
  subcategory: Reporting
  question: Is there a published accessibility statement giving conformance status, known issues, alternatives and how to report a problem, and a risk assessment and management plan for any non-conformance?
  evidence: Accessibility statement URL; risk assessment and management plan.
  weight: 2
  critical: false
  recommendation: Publish and maintain an accessibility statement, and document a risk assessment and management plan for any areas that do not yet conform, with dates for fixes.
  source: Web Accessibility Standard 1.2 s4 (assessment and reporting, incl. risk assessment and management plan)
  source_version: WAS 1.2
  nz_status: mandatory
  applies_to: public-facing
  link:
    label: NZ Web Accessibility Standard 1.2
    url: https://www.digital.govt.nz/standards-and-guidance/nz-government-web-standards/web-accessibility-standard-1-2
- id: ACC-16
  category: ACC
  subcategory: Inclusion
  question: Have disabled people (including blind and low vision users) been included in user research and usability testing for this service?
  evidence: Research plans and participant summaries showing disabled participants and assistive technology used.
  weight: 2
  critical: false
  recommendation: Recruit disabled people, including assistive technology users, into research and usability testing at each major stage of design and change.
  source: Digital Service Design Standard; AU Digital Service Standard 2.0 criterion 3 (leave no one behind)
  source_version: DSDS 2018 (refresh underway); AU DSS 2.0
  nz_status: recommended
  applies_to: all
  link:
    label: 'GOV.UK: making services more inclusive'
    url: https://www.gov.uk/service-manual/design/making-your-service-more-inclusive
- id: ACC-17
  category: ACC
  subcategory: Maturity
  question: Does the organisation have accessibility roles, training, and accessibility requirements in procurement and vendor contracts that apply to this service?
  evidence: Role descriptions, training records, contract clauses requiring WCAG 2.2 AA.
  weight: 1
  critical: false
  recommendation: Assign accessibility accountability, train designers, developers and content authors, and include accessibility conformance requirements and acceptance testing in vendor contracts.
  source: W3C Accessibility Maturity Model
  source_version: W3C Group Note (Nov 2025)
  nz_status: good-practice
  applies_to: all
  link:
    label: W3C Accessibility Maturity Model
    url: https://www.w3.org/TR/maturity-model/
- id: UXD-01
  category: UXD
  subcategory: Responsive design
  question: Is the service responsive or adaptive, so content and controls scale and reflow correctly across phone, tablet and desktop screen sizes and orientations?
  evidence: Device/browser test matrix results; analytics showing device mix.
  weight: 3
  critical: true
  recommendation: Ensure the application is adaptive, so content and objects scale to the user's screen size and orientation, and test key tasks on the devices your users actually use.
  source: OMB M-23-22 (design pillar); WCAG 2.2 SC 1.3.4, 1.4.10
  source_version: M-23-22 (2023); WCAG 2.2
  nz_status: good-practice
  applies_to: all
  link:
    label: 'GOV.UK: services that work on mobile'
    url: https://www.gov.uk/service-manual/technology/working-with-mobile-technology
- id: UXD-02
  category: UXD
  subcategory: User research
  question: Has research with real users of this service (not proxies) informed its design or changes in the last 12 months?
  evidence: Research reports, insights repository, decisions traced to research.
  weight: 3
  critical: false
  recommendation: Run regular user research with people who use the service, including those who struggle, and record how findings change the service.
  source: GOV.UK Service Standard point 1; AU DSS 2.0 criterion 2; Digital Service Design Standard
  source_version: GOV.UK SS (2019); AU DSS 2.0
  nz_status: recommended
  applies_to: all
  link:
    label: 'GOV.UK: understand users and needs'
    url: https://www.gov.uk/service-manual/service-standard/point-1-understand-user-needs
- id: UXD-03
  category: UXD
  subcategory: Usability testing
  question: Have the service's key tasks been usability tested with representative users, with task success and problem areas measured?
  evidence: Usability test reports with task completion rates and severity-rated issues.
  weight: 2
  critical: false
  recommendation: Usability test the most important tasks with representative users at least annually and after significant change, and fix high-severity issues first.
  source: GOV.UK Service Standard point 4; ISO 9241-11
  source_version: GOV.UK SS; ISO 9241-11:2018
  nz_status: good-practice
  applies_to: all
  link:
    label: 'GOV.UK: make the service simple'
    url: https://www.gov.uk/service-manual/service-standard/point-4-make-the-service-simple-to-use
- id: UXD-04
  category: UXD
  subcategory: Heuristics
  question: Has the service been reviewed against recognised usability heuristics (for example Nielsen's 10 usability heuristics) in the last 12 months?
  evidence: Heuristic review findings with severity ratings.
  weight: 1
  critical: false
  recommendation: Complete a heuristic review against Nielsen's 10 usability heuristics and add findings to the improvement backlog.
  source: Nielsen's 10 usability heuristics (NN/g)
  source_version: 1994, updated 2020
  nz_status: good-practice
  applies_to: all
  link:
    label: 'NN/g: running a heuristic evaluation'
    url: https://www.nngroup.com/articles/how-to-conduct-a-heuristic-evaluation/
  review_note: Reuse heuristic names and concepts; write your own descriptions rather than copying NN/g text.
- id: UXD-05
  category: UXD
  subcategory: Feedback
  question: Does the service always tell users what is happening - loading, saving, submitting - and give clear confirmation of what has been done and what happens next?
  evidence: Screens for loading, success and confirmation states; confirmation messages/emails.
  weight: 2
  critical: false
  recommendation: Show clear progress and loading states, and give a confirmation page and message with a reference number and what happens next for every completed transaction.
  source: Nielsen heuristic 1 (visibility of system status)
  source_version: ''
  nz_status: good-practice
  applies_to: all
  link:
    label: 'NN/g: 10 usability heuristics'
    url: https://www.nngroup.com/articles/ten-usability-heuristics/
- id: UXD-06
  category: UXD
  subcategory: Findability
  question: Can users find what they need - clear navigation, labels in users' language, and site search that returns relevant results?
  evidence: Tree test or findability results; search analytics (top queries, zero-result searches).
  weight: 2
  critical: false
  recommendation: Structure navigation around user tasks, test it with users, and monitor search queries to improve labels and results.
  source: OMB M-23-22 (search pillar); Nielsen heuristic 2
  source_version: M-23-22
  nz_status: good-practice
  applies_to: all
  link:
    label: 'NN/g: 10 usability heuristics'
    url: https://www.nngroup.com/articles/ten-usability-heuristics/
- id: UXD-07
  category: UXD
  subcategory: Errors
  question: Does the service prevent errors and help users recover - confirming destructive actions, saving progress, and explaining errors in plain language?
  evidence: Error message inventory; save-and-return feature; confirmation patterns.
  weight: 2
  critical: false
  recommendation: Prevent common errors with good defaults and validation, let users save and return to long forms, and write error messages that say what went wrong and how to fix it.
  source: Nielsen heuristics 3, 5 and 9
  source_version: ''
  nz_status: good-practice
  applies_to: transactional
  link:
    label: 'NN/g: 10 usability heuristics'
    url: https://www.nngroup.com/articles/ten-usability-heuristics/
- id: UXD-08
  category: UXD
  subcategory: Design system
  question: Is the service built using an established design system or pattern library (organisation or shared government) rather than one-off components?
  evidence: Design system name and version; component usage audit.
  weight: 2
  critical: false
  recommendation: Use and contribute to a shared design system so components are tested, accessible and consistent across the organisation's services.
  source: GOV.UK Service Standard point 13; AU DSS 2.0 criterion 6 (don't reinvent the wheel)
  source_version: ''
  nz_status: good-practice
  applies_to: all
  link:
    label: 'GOV.UK: reuse common components, patterns'
    url: https://www.gov.uk/service-manual/service-standard/point-13-use-common-standards-components-patterns
- id: UXD-09
  category: UXD
  subcategory: Whole journey
  question: Has the end-to-end user journey been mapped, including offline steps, other agencies and hand-offs, and are pain points across channels addressed?
  evidence: Journey or service blueprint; list of cross-channel issues and actions.
  weight: 2
  critical: false
  recommendation: Map the full journey across channels and organisations and design the digital service to work smoothly with the steps before and after it.
  source: GOV.UK Service Standard points 2 and 3; AU DSS 2.0 criterion 4 (connect services)
  source_version: ''
  nz_status: good-practice
  applies_to: all
  link:
    label: 'GOV.UK: solve a whole problem'
    url: https://www.gov.uk/service-manual/service-standard/point-2-solve-a-whole-problem
- id: UXD-10
  category: UXD
  subcategory: Performance
  question: Do pages load and respond quickly on typical NZ mobile connections and devices, with front-end performance (for example Core Web Vitals) monitored?
  evidence: Lighthouse or real-user monitoring results for key pages.
  weight: 2
  critical: false
  recommendation: Set performance budgets, monitor real-user performance (for example Core Web Vitals) and optimise key pages for mobile devices and slower connections.
  source: Google Core Web Vitals; OMB M-23-22
  source_version: ''
  nz_status: good-practice
  applies_to: all
  link:
    label: 'Google: Core Web Vitals'
    url: https://web.dev/articles/vitals
- id: UXD-11
  category: UXD
  subcategory: Compatibility
  question: Is there a defined browser, device and assistive technology support policy, and is the service tested against it before release?
  evidence: Support policy; release test evidence.
  weight: 1
  critical: false
  recommendation: Define which browsers, devices and assistive technologies are supported based on user data, and test against that list before each release.
  source: GOV.UK Service Manual (designing for different browsers and devices)
  source_version: ''
  nz_status: good-practice
  applies_to: all
  link:
    label: 'GOV.UK: browser and device testing'
    url: https://www.gov.uk/service-manual/technology/designing-for-different-browsers-and-devices
- id: UXD-12
  category: UXD
  subcategory: Data minimisation
  question: Does the service only ask for information it needs, and reuse information the agency already holds where lawful (so users don't repeat themselves)?
  evidence: Field-by-field justification; data reuse arrangements.
  weight: 1
  critical: false
  recommendation: Remove questions that aren't needed, explain why information is asked for, and reuse information already held where the law allows.
  source: Privacy Act 2020 IPP 1; AU DSS 2.0 criterion 4
  source_version: Privacy Act 2020
  nz_status: recommended
  applies_to: transactional
  link:
    label: Privacy Act 2020
    url: https://www.legislation.govt.nz/act/public/2020/31/en/latest/
- id: CON-01
  category: CON
  subcategory: Plain language
  question: Is content written in plain language appropriate to the intended audience, and has it been checked (for example readability testing or user testing)?
  evidence: Content review results; readability scores; plain language checks.
  weight: 3
  critical: false
  recommendation: Write and review all public content in plain language, test it with users, and follow the agency's Plain Language Act processes.
  source: Plain Language Act 2022
  source_version: Plain Language Act 2022
  nz_status: mandatory
  applies_to: public-facing
  link:
    label: Plain Language Act 2022
    url: https://www.legislation.govt.nz/act/public/2022/0054/latest/whole.html
  review_note: Applies to public service agencies and Crown agents. A Plain Language Act Repeal Bill was introduced in 2025 (first reading 1 Apr 2025) and had not been enacted at 24 Oct 2026. If the Act is repealed, change NZ status to Good practice and keep the criterion.
- id: CON-02
  category: CON
  subcategory: Tone of voice
  question: Does the organisation have tone of voice guidelines, and does the service's content follow them?
  evidence: Tone of voice guidelines; content review against them.
  weight: 2
  critical: false
  recommendation: Apply the organisation's tone of voice guidelines to all service content, including error messages, emails and letters, and review content against them.
  source: Organisation brand and tone of voice guidelines
  source_version: Organisation-specific
  nz_status: good-practice
  applies_to: all
  link:
    label: Use your organisation's tone of voice
    url: ''
  review_note: Organisation supplies its own guideline reference.
- id: CON-03
  category: CON
  subcategory: Style
  question: Is content consistent with a content style guide (NZ English, terminology, dates, numbers, capitalisation)?
  evidence: Style guide reference; content audit results.
  weight: 1
  critical: false
  recommendation: Adopt a content style guide (organisation or NZ Government) and apply it consistently, including a glossary of service terms.
  source: Organisation style guide; NZ Government content guidance (Digital.govt.nz)
  source_version: ''
  nz_status: good-practice
  applies_to: all
  link:
    label: Use your organisation's style guide
    url: ''
- id: CON-04
  category: CON
  subcategory: Accuracy
  question: Is service content authoritative and current, with no duplicate or conflicting information across the agency's channels?
  evidence: Content inventory; duplicate content review.
  weight: 2
  critical: false
  recommendation: Keep one authoritative source for each piece of service information, remove or redirect duplicates, and check consistency with call centre scripts and printed material.
  source: OMB M-23-22 (content pillar)
  source_version: ''
  nz_status: good-practice
  applies_to: all
  link:
    label: US digital-first experience memo
    url: https://www.whitehouse.gov/wp-content/uploads/2023/09/M-23-22-Delivering-a-Digital-First-Public-Experience.pdf
- id: CON-05
  category: CON
  subcategory: Links and labels
  question: Are buttons, links and labels clear and specific (no 'click here'), and has microcopy been tested with users?
  evidence: Audit findings for SC 2.4.4; microcopy test results.
  weight: 1
  critical: false
  recommendation: Write descriptive link text and button labels that make sense out of context, and test key microcopy with users.
  source: WCAG 2.2 SC 2.4.4, 2.4.6
  source_version: WCAG 2.2 A/AA
  nz_status: mandatory
  applies_to: all
  link:
    label: WCAG 2.2 quick reference
    url: https://www.w3.org/WAI/WCAG22/quickref/
- id: CON-06
  category: CON
  subcategory: Te reo Māori
  question: Has the service considered te reo Māori - correct use and display of macrons, bilingual names and content where appropriate?
  evidence: Te reo Māori approach; macron rendering test; reviewed translations.
  weight: 1
  critical: false
  recommendation: Agree a te reo Māori approach for the service, ensure macrons display and are searchable, and have te reo content reviewed by a qualified speaker.
  source: Te Ture mō Te Reo Māori 2016 (Māori Language Act); Digital Service Design Standard
  source_version: ''
  nz_status: recommended
  applies_to: all
  link:
    label: Māori Language Act 2016
    url: https://www.legislation.govt.nz/act/public/2016/0017/latest/DLM6174566.html
- id: CON-07
  category: CON
  subcategory: Alternative formats
