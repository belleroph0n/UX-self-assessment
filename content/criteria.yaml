  category: LEG
  subcategory: Records
  question: Are records created by the service captured, kept and disposed of in line with the Public Records Act and the agency's disposal authority?
  evidence: Records management assessment; disposal authority reference.
  weight: 2
  critical: false
  recommendation: Assess the service against Archives NZ requirements, ensure records are captured and retained correctly, and apply the relevant disposal authority.
  source: Public Records Act 2005; Archives NZ Information and Records Management Standard (16/S1)
  source_version: ''
  nz_status: mandatory
  applies_to: all
  link:
    label: Archives NZ records management standard
    url: https://archives.govt.nz/manage-information/how-to-manage-your-information/key-obligations-and-the-standard/information-and-records-management-standard
- id: LEG-03
  category: LEG
  subcategory: Information access
  question: Can information held by the service be found and retrieved to respond to Official Information Act and Privacy Act access requests within statutory timeframes?
  evidence: Retrieval process; test retrieval.
  weight: 1
  critical: false
  recommendation: Make sure information can be searched and extracted to answer OIA and Privacy Act requests within statutory timeframes.
  source: Official Information Act 1982; Privacy Act 2020 IPP 6
  source_version: ''
  nz_status: mandatory
  applies_to: all
  link:
    label: Official Information Act 1982
    url: https://www.legislation.govt.nz/act/public/1982/156/en/latest/
- id: LEG-04
  category: LEG
  subcategory: Equal access
  question: Has the service been checked to ensure it does not discriminate, and that disabled people and other groups have equivalent access to the service and information?
  evidence: Equity or inclusion assessment; accessibility evidence.
  weight: 2
  critical: false
  recommendation: Assess the service for discriminatory effects and barriers to access, and provide equivalent access routes where barriers can't be removed.
  source: Human Rights Act 1993; NZ Bill of Rights Act 1990; UNCRPD
  source_version: ''
  nz_status: mandatory
  applies_to: all
  link:
    label: Human Rights Act 1993
    url: https://www.legislation.govt.nz/act/public/1993/82/en/latest/
- id: LEG-05
  category: LEG
  subcategory: Legal basis
  question: Does the service accurately reflect its legal basis - eligibility rules, statutory timeframes, fees and rights of review or appeal?
  evidence: Legal review sign-off of rules and content.
  weight: 2
  critical: false
  recommendation: Have the service's rules and content reviewed against the empowering legislation, and tell users about their rights of review or appeal.
  source: Empowering legislation for the service
  source_version: Service-specific
  nz_status: mandatory
  applies_to: transactional
  link:
    label: Refer to your service's own legislation
    url: ''
- id: LEG-06
  category: LEG
  subcategory: Terms of use
  question: Are terms of use published for transactional or authenticated services, in plain language?
  evidence: Terms of use URL.
  weight: 1
  critical: false
  recommendation: Publish plain language terms of use covering acceptable use, liability and how accounts and data are managed.
  source: Good practice
  source_version: ''
  nz_status: good-practice
  applies_to: authenticated
  link:
    label: Use your organisation's internal guidance
    url: ''
- id: LEG-07
  category: LEG
  subcategory: Algorithms and AI
  question: If the service uses algorithms or AI that affect people, has this been assessed against NZ Government AI and algorithm guidance, with transparency for users?
  evidence: Algorithm/AI assessment; public explanation.
  weight: 1
  critical: false
  recommendation: Assess algorithmic and AI use against NZ Government guidance and the Algorithm Charter (if a signatory), and explain to users how decisions are made.
  source: Algorithm Charter for Aotearoa New Zealand; Public Service AI Framework (2025)
  source_version: ''
  nz_status: recommended
  applies_to: uses-ai
  link:
    label: Algorithm Charter for Aotearoa NZ
    url: https://data.govt.nz/algorithm-charter/
- id: LEG-08
  category: LEG
  subcategory: Te Tiriti
  question: Have the Crown's obligations under Te Tiriti o Waitangi been considered in the design of the service, including Māori users' needs?
  evidence: Engagement records; design decisions.
  weight: 1
  critical: false
  recommendation: Engage with Māori users and partners in design and consider how the service supports the Crown's relationship with Māori.
  source: Public Service Act 2020 s14; Digital Service Design Standard
  source_version: ''
  nz_status: recommended
  applies_to: all
  link:
    label: Public Service Act 2020, section 14
    url: https://www.legislation.govt.nz/act/public/2020/0040/latest/LMS356875.html
- id: LEG-09
  category: LEG
  subcategory: Legislative compliance
  question: Has the service identified the legislation it is subject to - including service-specific legislation such as the Planning Act and Natural Environment Act where relevant - and confirmed it meets the relevant provisions, including equal access, legal basis, public records and information access?
  evidence: Register of legislation that applies to the service, with each obligation and how it is met; legal review sign-off; links to evidence for LEG-02 to LEG-05.
  weight: 3
  critical: false
  recommendation: Create and maintain a register of the legislation the service is subject to - including service-specific Acts such as the Planning Act and Natural Environment Act, and cross-cutting obligations on equal access, legal basis, public records and information access - have it reviewed by legal advisors, and re-check it when legislation or the service changes.
  source: Planning Act; Natural Environment Act; Human Rights Act 1993; NZ Bill of Rights Act 1990; Public Records Act 2005; Official Information Act 1982; Privacy Act 2020
  source_version: Planning Act and Natural Environment Act in force 30 Sep 2026 (transitional provisions apply)
  nz_status: mandatory
  applies_to: all
  link:
    label: Planning and Natural Environment Acts overview
    url: https://www.buddlefindlay.com/insights/resource-management-reform-an-overview-of-the-planning-act-and-natural-environment-act/
  review_note: Catch-all legal criterion at weight 3 (v1.10) so legislative obligations are covered in the simple set. Detailed checks remain at LEG-02 to LEG-05. The Planning Act and Natural Environment Act replace the Resource Management Act system with transitional arrangements - confirm which provisions apply to the service.
- id: CMG-01
  category: CMG
  subcategory: Ownership
  question: Is there a named service owner accountable for the service's user experience, roadmap and budget?
  evidence: Named owner and terms of reference.
  weight: 2
  critical: false
  recommendation: Appoint a service owner with the authority and budget to improve the service over its lifetime.
  source: GOV.UK Service Standard point 6
  source_version: ''
  nz_status: good-practice
  applies_to: all
  link:
    label: 'GOV.UK: have a multidisciplinary team'
    url: https://www.gov.uk/service-manual/service-standard/point-6-have-a-multidisciplinary-team
- id: CMG-02
  category: CMG
  subcategory: Content lifecycle
  question: Does each piece of content have an owner and review date, with outdated content updated, archived or removed?
  evidence: Content inventory with owners and review dates.
  weight: 2
  critical: false
  recommendation: Assign owners and review dates to all content, review at least annually and remove or archive content that is out of date.
  source: Good practice; WAS 1.2 (inactive web pages)
  source_version: ''
  nz_status: good-practice
  applies_to: all
  link:
    label: US digital-first experience memo
    url: https://www.whitehouse.gov/wp-content/uploads/2023/09/M-23-22-Delivering-a-Digital-First-Public-Experience.pdf
- id: CMG-03
  category: CMG
  subcategory: Accessible authoring
  question: Does the content management system support accessible authoring - enforcing headings, alt text, link text and accessibility checks before publishing?
  evidence: CMS configuration; authoring guidance.
  weight: 2
  critical: false
  recommendation: Configure the CMS to prompt for and check accessibility (alt text, headings, link text) and block publishing of known errors.
  source: W3C ATAG 2.0
  source_version: ATAG 2.0
  nz_status: good-practice
  applies_to: uses-cms
  link:
    label: W3C authoring tool guidelines (ATAG)
    url: https://www.w3.org/WAI/standards-guidelines/atag/
- id: CMG-04
  category: CMG
  subcategory: Publishing workflow
  question: Is there a publishing workflow with review and approval, and are content authors trained in plain language and accessibility?
  evidence: Workflow configuration; training records.
  weight: 1
  critical: false
  recommendation: Set up a review and approval workflow and train authors in plain language, accessibility and the style guide.
  source: Good practice
  source_version: ''
  nz_status: good-practice
  applies_to: uses-cms
  link:
    label: W3C authoring tool guidelines (ATAG)
    url: https://www.w3.org/WAI/standards-guidelines/atag/
- id: CMG-05
  category: CMG
  subcategory: Link health
  question: Are broken links, redirects and URL changes monitored and managed?
  evidence: Link checker results; redirect register.
  weight: 1
  critical: false
  recommendation: Run regular broken-link checks and maintain redirects when URLs change.
  source: Good practice
  source_version: ''
  nz_status: good-practice
  applies_to: all
  link:
    label: Use your organisation's internal guidance
    url: ''
- id: CMG-06
  category: CMG
  subcategory: Sustained funding
  question: Is ongoing funding and capacity in place to keep improving the service after launch, not only for the initial project?
  evidence: Budget line; team capacity plan.
  weight: 2
  critical: false
  recommendation: Secure ongoing funding and a team to maintain and improve the service across its lifetime.
  source: Digital Service Design Standard; AU DSS 2.0 criterion 10 (keep it relevant)
  source_version: ''
  nz_status: recommended
  applies_to: all
  link:
    label: NZ Digital Service Design principles
    url: https://www.digital.govt.nz/standards-and-guidance/digital-service-design-standard/principles
- id: CMG-07
  category: CMG
  subcategory: Content management
  question: Is there an agreed content management approach for the service - named content owners, a review schedule, a publishing workflow with approval, and accessible authoring - and is it being followed?
  evidence: Content management plan; content inventory with owners and review dates; publishing workflow records from the last 3 months.
  weight: 3
  critical: false
  recommendation: Put in place and follow a content management approach with named owners, scheduled reviews, an approval workflow and accessible authoring, so content stays accurate, current and consistent.
  source: OMB M-23-22 (content pillar); W3C ATAG 2.0; good practice
  source_version: ''
  nz_status: good-practice
  applies_to: all
  link:
    label: US digital-first experience memo
    url: https://www.whitehouse.gov/wp-content/uploads/2023/09/M-23-22-Delivering-a-Digital-First-Public-Experience.pdf
  review_note: 'Weight 3: content management, governance, measurement and continuous improvement are critical to app health and hygiene, and therefore have a consequential impact on user experience if not considered as part of the assessment. Added in v1.10.'
- id: CMG-08
  category: CMG
  subcategory: Governance
  question: Does the service have clear governance - a named service owner, defined decision rights, a regular forum that reviews performance, risks and the improvement roadmap, and funding for ongoing maintenance?
  evidence: Terms of reference; recent governance minutes; risk register; funded roadmap.
  weight: 3
  critical: false
  recommendation: Establish governance for the service with a named owner, clear decision rights, a regular review of performance, risks and roadmap, and ongoing funding for maintenance and improvement.
  source: GOV.UK Service Standard point 6; Digital Service Design Standard; AU Digital Service Standard 2.0 criterion 10 (keep it relevant)
  source_version: ''
  nz_status: recommended
  applies_to: all
  link:
    label: 'GOV.UK: have a multidisciplinary team'
    url: https://www.gov.uk/service-manual/service-standard/point-6-have-a-multidisciplinary-team
  review_note: 'Weight 3: content management, governance, measurement and continuous improvement are critical to app health and hygiene, and therefore have a consequential impact on user experience if not considered as part of the assessment. Added in v1.10.'
- id: MSR-01
  category: MSR
  subcategory: Success measures
  question: Are success measures defined for the service (for example completion rate, user satisfaction, cost per transaction, digital take-up) and tracked?
  evidence: Measurement framework; dashboard.
  weight: 2
  critical: false
  recommendation: Define success measures linked to the service's purpose and track them in a dashboard the team reviews regularly.
